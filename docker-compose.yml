# Ohh My Chicken! — four services:
#   frontend  React build + SEO page server; proxies /api to the backend (public)
#   backend   Express JSON API (internal only)
#   db        PostgreSQL 16 (internal only)
#   backup    nightly database backup into ./backups (deploy/backup.sh)
#
#   cp .env.example .env      # set POSTGRES_PASSWORD (and ADMIN_PASSCODE)
#   docker compose up -d --build
#   open http://localhost:3000

# Logs are capped (2 × 5 MB per service, oldest dropped) so they never grow on disk.
x-logging: &logging
  driver: json-file
  options: { max-size: "5m", max-file: "2" }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: omc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ohh_my_chicken
    volumes:
      - omc-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omc -d ohh_my_chicken"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [backend]
    # No published port: only the backend can reach the database.
    # For local tools (psql, TablePlus) uncomment:
    # ports: ["127.0.0.1:5432:5432"]

  backend:
    build: ./backend
    image: ohh-my-chicken-backend:latest
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://omc:${POSTGRES_PASSWORD}@db:5432/ohh_my_chicken
      NODE_ENV: local
      PORT: 4000
      # Requests arrive through the frontend server.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      ADMIN_PASSCODE: ${ADMIN_PASSCODE:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      UPLOAD_DIR: /app/uploads
      # Anonymous analytics: timezone for "busy hours" and how long raw events are kept.
      ANALYTICS_TZ: ${ANALYTICS_TZ:-Asia/Kathmandu}
      ANALYTICS_RETENTION_DAYS: ${ANALYTICS_RETENTION_DAYS:-180}
      # Customers' names, phones and addresses are blanked on orders older than this.
      ORDER_DETAILS_DAYS: ${ORDER_DETAILS_DAYS:-90}
      # Where the backup service writes; the dashboard shows when the last backup succeeded.
      BACKUP_DIR: /app/backups
    volumes:
      # Photo files for fast serving; the database keeps a copy and refills this if it is empty.
      - omc-media:/app/uploads
      - ./backups:/app/backups:ro
    # No published port: browsers reach the API through the frontend at /api.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # A runaway process (or a flood) can't take the whole server down with it.
    mem_limit: 768m
    pids_limit: 200
    networks: [backend, frontend]

  frontend:
    build: ./frontend
    image: ohh-my-chicken-frontend:latest
    restart: unless-stopped
    logging: *logging
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:4000
      ADMIN_PATH: ${ADMIN_PATH:-admin}
      # Public address for canonical URLs, sitemap and social cards (e.g. https://ohhmychicken.com).
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Set when another proxy (Caddy, a load balancer…) sits in front.
      TRUST_PROXY: ${FRONTEND_TRUST_PROXY:-}
    ports:
      # Only this machine (and Nginx on it) can reach the app. Docker-published ports
      # bypass ufw, and anyone reaching this port directly could fake their IP and dodge
      # the per-IP limits. Set APP_BIND=0.0.0.0 only to open it on a private network.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:8080"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 384m
    pids_limit: 200
    networks: [frontend]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: omc
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ohh_my_chicken
      TZ: Asia/Kathmandu
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      # 1 also includes the photo files in each nightly dump (all of them, every time).
      BACKUP_PHOTOS: ${BACKUP_PHOTOS:-0}
      # Who owns the backup files on the host (user:group); only they can read them.
      BACKUP_OWNER: ${BACKUP_OWNER:-1000:1000}
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    # Sleeps all day; pg_dump of a small restaurant database takes a second or two.
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 20
    networks: [backend]

volumes:
  omc-data:
  omc-media:

networks:
  backend:
  frontend:
