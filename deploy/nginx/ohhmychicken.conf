# ==========================================================================
# Ohh My Chicken! behind Nginx (Ubuntu): /etc/nginx/sites-available/ohhmychicken
#
#  1. Replace example.com (4 places) with your domain.
#     LAN-only VM without a domain: use   server_name _;   and delete the www block.
#  2. sudo ln -s /etc/nginx/sites-available/ohhmychicken /etc/nginx/sites-enabled/
#     sudo rm -f /etc/nginx/sites-enabled/default
#     sudo nginx -t && sudo systemctl reload nginx
#  3. HTTPS: sudo certbot --nginx -d example.com -d www.example.com --redirect
#     (Certbot adds the certificate, the 443 listener and the http→https redirect.)
#     Then, in the 443 server block certbot wrote, add (faster repeat connections):
#         http2 on;
#         ssl_session_cache shared:omc_ssl:10m;  ssl_session_timeout 1d;
#  4. Behind Cloudflare: sudo sh deploy/nginx/cloudflare-realip.sh
#     (otherwise every visitor looks like a Cloudflare IP and they share rate limits)
#
# App .env to match: APP_BIND=127.0.0.1  FRONTEND_TRUST_PROXY=1  TRUST_PROXY=2
#                    PUBLIC_URL=https://example.com
# ==========================================================================

# Edge rate limits per visitor IP. The app has its own limits too; these stop
# floods before they reach Node. (Must be outside server{}; this file is
# included inside http{} by Ubuntu's nginx.conf.)
limit_req_zone  $binary_remote_addr zone=omc_pages:10m rate=20r/s;
limit_req_zone  $binary_remote_addr zone=omc_api:10m   rate=10r/s;
limit_req_zone  $binary_remote_addr zone=omc_login:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=omc_conn:10m;

upstream omc_app {
    server 127.0.0.1:3000;   # APP_PORT from .env (bound to localhost by APP_BIND=127.0.0.1)
    keepalive 16;
}

# www → bare domain: one canonical address for search engines.
server {
    listen 80;
    listen [::]:80;
    server_name www.example.com;
    return 301 https://example.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    server_tokens off;            # don't advertise the Nginx version
    client_max_body_size 1m;      # JSON requests; photo uploads get more below
    client_header_timeout 15s;    # drop slow-header (slowloris) clients
    client_body_timeout 30s;
    keepalive_timeout 30s;
    limit_conn omc_conn 40;       # simultaneous connections per IP
    limit_req_status 429;
    limit_conn_status 429;

    # Passed to the app on every request (inherited by the locations below).
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;               # as the browser sent it, port included: the app checks Origin against Host
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;  # replace, don't append: visitors can't spoof it
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    # Pages, scripts, photos (the app sets the cache headers).
    location / {
        limit_req zone=omc_pages burst=80 nodelay;
        proxy_pass http://omc_app;
    }

    # JSON API
    location /api/ {
        limit_req zone=omc_api burst=40 nodelay;
        proxy_pass http://omc_app;
    }

    # Staff login: a handful of tries per minute is plenty for a human.
    location = /api/admin/login {
        limit_req zone=omc_login burst=5 nodelay;
        proxy_pass http://omc_app;
    }

    # Photo uploads (dashboard): up to 10 MB each. Nginx buffers the whole
    # upload first, so a slow phone connection never ties up the app.
    location = /api/media {
        limit_req zone=omc_api burst=20 nodelay;
        client_max_body_size 12m;
        client_body_timeout 120s;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
        proxy_pass http://omc_app;
    }
}
